dependencies = [
    "pyside6",
    "xsideui",
    "llama-cpp-python==0.3.34",
]

[tool.uv]
package = false

[tool.uv.sources]
llama-cpp-python = { path = "wheels/llama_cpp_python-0.3.34-py3-none-win_amd64.whl" }
